# Romanization: REFINED ROMANISATION (id "refined") (code point -> Latin). The canonical ASCII form of our hybrid scheme: the
# PRIMARY (first-listed) alias per code point from schemes/refined.yaml. Pure ASCII (apostrophe = ').
# Use as display.scheme: refined to always show our canonical form regardless of which scheme was typed
# (differs from display.scheme: input, which echoes the exact keystrokes). Greedy longest-match.
map:
  # digraphs (empty-rime syllables), matched first
  U+186F+U+1873+U+180C: "dzy"
  U+186E+U+185F: "tsy"
  U+1830+U+185F: "sy"
  U+1871+U+1873: "chy"
  U+1877+U+1873: "jy"
  # vowels
  U+1820: "a"
  U+185D: "e"
  U+1873: "i"
  U+185F: "y"
  U+1823: "o"
  U+1860: "u"
  U+1861: "v"
  # consonants
  U+1828: "n"
  U+1829: "ng"
  U+1874: "k"
  U+1864: "g"
  U+1865: "h"
  U+182A: "b"
  U+1866: "p"
  U+1830: "s"
  U+1867: "sh"
  U+1868: "t"
  U+1869: "d"
  U+182F: "l"
  U+182E: "m"
  U+1834: "ch"   # the primary display form is `ch`, in step with its first-listed input alias in schemes/refined.yaml
  U+1835: "j"
  U+1836: "y"
  U+1875: "r"
  U+1876: "f"
  U+1838: "w"
  # Loanword letters (ASCII apostrophe: refined is the ASCII-hybrid scheme)
  U+183A: "k'"
  U+186C: "g'"
  U+186D: "h'"
  U+186E: "ts"
  U+186F: "dz"
  U+1870: "zh"
  U+1871: "ch"
  U+1877: "j"
  # punctuation / format controls
  U+1808: ","
  U+1809: "."
  U+202F: "-"
  U+180A: "-"
  U+180B: ""
  U+180C: ""
  U+180D: ""
  U+180F: ""
  U+180E: "'"
  U+1807: "'"
