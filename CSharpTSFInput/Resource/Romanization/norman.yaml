# Romanization: NORMAN 2013 (code point -> Latin). CANONICAL forms:
#   - diacritics stored COMBINING (u+U+0304, s+U+030C, z+U+030C)
#   - loan velars use TYPOGRAPHIC apostrophe U+2019 (Norman uses the RIGHT quote, not U+2018)
#   - ts / cy carry NO apostrophe (differs from Moellendorff ts' / c'y)
# Greedy longest-match; UNQUOTED U+XXXX keys; FVS -> "". punctuation: U+1808 Manchu comma,
# U+1809 Manchu full stop (the script-own marks) -> Latin , .
