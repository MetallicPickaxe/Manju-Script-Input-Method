  k: "ᡴ"
  g: "ᡤ"
  h: "ᡥ"
  l: "ᠯ"
  m: "ᠮ"
  j: "ᠵ"
  y: "ᠶ"
  r: "ᡵ"
  f: "ᡶ"
  w: "ᠸ"
  t: "ᡨ"
