# Input scheme: BabelPad. Pure ASCII (no diacritics, no apostrophes): x, kh/gh/hh, ts, dz, z,
# chi/zhi. token -> codepoint ONLY (transliteration-free). Greedy longest-match 4->1.
# NOTE: the empty-rime ᡯᡳ᠌ is homographic with ᡯ ("dz") in BabelPad, so it is not separately
# inputtable here (use the refined/abkai scheme if you need it).
