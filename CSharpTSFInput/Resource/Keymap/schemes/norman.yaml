  a: "ᠠ"
  e: "ᡝ"
  i: "ᡳ"
  o: "ᠣ"
  u: "ᡠ"
  ū: "ᡡ"
  n: "ᠨ"
  k: "ᡴ"
  g: "ᡤ"
  h: "ᡥ"
  b: "ᠪ"
  p: "ᡦ"
  s: "ᠰ"
  š: "ᡧ"
  t: "ᡨ"
  d: "ᡩ"
  l: "ᠯ"
  m: "ᠮ"
  c: "ᠴ"
  j: "ᠵ"
  y: "ᠶ"
  r: "ᡵ"
