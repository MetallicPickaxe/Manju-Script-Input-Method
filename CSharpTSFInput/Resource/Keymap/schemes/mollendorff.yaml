# Input scheme: MÖLLENDORFF (1892). Canonical letters as input tokens (incl. diacritics
# ū/š/ž and apostrophe loan-velars). token -> codepoint ONLY; transliteration-free (the
# on-screen romanization is the token AS TYPED; dict lookup transliterates codepoints).
# NOTE: the empty-rime ᡯᡳ᠌ is homographic with ᡯ ("dz") in Möllendorff and is therefore
# not separately inputtable in this scheme (use the refined/abkai scheme if you need it).
mappings:
  a: "ᠠ"
  e: "ᡝ"
  i: "ᡳ"
  o: "ᠣ"
  u: "ᡠ"
  ū: "ᡡ"
  n: "ᠨ"
  k: "ᡴ"
  g: "ᡤ"
  h: "ᡥ"
  b: "ᠪ"
  p: "ᡦ"
  s: "ᠰ"
  š: "ᡧ"
  t: "ᡨ"
  d: "ᡩ"
  l: "ᠯ"
  m: "ᠮ"
  c: "ᠴ"
  j: "ᠵ"
  y: "ᠶ"
  r: "ᡵ"
  f: "ᡶ"
  w: "ᠸ"
  ng: "ᠩ"
  k': "ᠺ"
  g': "ᡬ"
  h': "ᡭ"
  ts': "ᡮ"
  ts: "ᡮᡟ"
  dz: "ᡯ"
  ž: "ᡰ"
  sy: "ᠰᡟ"
  c'y: "ᡱᡳ"
  jy: "ᡷᡳ"
  -: "᠎"
