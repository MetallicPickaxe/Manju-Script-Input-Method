  ch: "ᠴ"
  zh: "ᠵ"
  y: "ᠶ"
  r: "ᡵ"
  f: "ᡶ"
  w: "ᠸ"
  ng: "ᠩ"
  kk: "ᠺ"
  gg: "ᡬ"
  hh: "ᡭ"
